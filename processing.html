<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Processing</title>

<link rel="stylesheet" href="css/processing.css">

<script defer src="js/processing.js"></script>

</head>

<body>

<div class="background"></div>

<div class="container">

<div class="glass">

<h1>

🤖 BlurAI Studio

</h1>

<h2>

Processing Your Video...

</h2>

<p>

Our AI is analyzing every frame.

</p>

<div class="circle">

<div class="scanner"></div>

</div>

<h3 id="status">

Uploading Video...

</h3>

<div class="progress-box">

<div class="progress" id="progress"></div>

</div>

<p id="percent">

0%

</p>

<div class="steps">

<div class="step" id="step1">

✔ Upload Video

</div>

<div class="step" id="step2">

🤖 Detect Objects

</div>

<div class="step" id="step3">

🎯 Track Object

</div>

<div class="step" id="step4">

✨ Apply Blur

</div>

<div class="step" id="step5">

🎬 Render Video

</div>

</div>

<p class="time">

Estimated Time Remaining

<span id="time">

25 sec

</span>

</p>

</div>

</div>

</body>

</html>
